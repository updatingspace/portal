name: Run YDB Migrations

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      services:
        description: Comma-separated services to migrate, or all.
        required: false
        default: all
      max_attempts:
        description: Number of migrate_ydb attempts per service.
        required: false
        default: '5'
      sleep_seconds:
        description: Backoff delay between attempts and services.
        required: false
        default: '120'

concurrency:
  group: ydb-migrations-production
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare service matrix
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.services.outputs.services }}
    steps:
      - name: Resolve services
        id: services
        env:
          REQUESTED_SERVICES: ${{ inputs.services }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import sys

          default_services = [
              "bff",
              "access",
              "portal",
              "activity",
              "voting",
              "events",
              "featureflags",
              "gamification",
          ]
          aliases = {"", "all", "*"}
          raw = os.environ.get("REQUESTED_SERVICES", "all").strip()
          if raw.lower() in aliases:
              services = default_services
          else:
              services = [item.strip() for item in raw.split(",") if item.strip()]

          invalid = sorted(set(services) - set(default_services))
          if invalid:
              print(f"Invalid services: {', '.join(invalid)}", file=sys.stderr)
              sys.exit(1)

          ordered = [service for service in default_services if service in services]
          print(f"services={json.dumps(ordered)}")
          PY

  migrate:
    name: Migrate YDB (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs:
      - prepare
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service: ${{ fromJson(needs.prepare.outputs.services) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    env:
      DJANGO_SETTINGS_MODULE: app.settings
      PYTHONPATH: src
      ALLOWED_HOSTS: .updspace.com,.yandexcloud.net,localhost,127.0.0.1
      DJANGO_SECRET_KEY: migrate-secret
      BFF_INTERNAL_HMAC_SECRET: ${{ secrets.YC_BFF_INTERNAL_HMAC_SECRET }}
      BFF_UPDSPACEID_CALLBACK_SECRET: ${{ secrets.YC_BFF_UPDSPACEID_CALLBACK_SECRET }}
      ACTIVITY_DATA_ENCRYPTION_KEY: ${{ secrets.YC_ACTIVITY_DATA_ENCRYPTION_KEY }}
      DB_DRIVER: ydb
      YDB_ENDPOINT: ${{ secrets.YC_YDB_ENDPOINT }}
      YDB_DATABASE: ${{ secrets.YC_YDB_DATABASE }}
      YDB_NAME: default
      YDB_CREDENTIALS_MODE: sa_json
      YDB_SERVICE_ACCOUNT_JSON: ${{ secrets.YC_SERVICE_ACCOUNT_KEY_JSON }}
      MAX_ATTEMPTS: ${{ inputs.max_attempts }}
      SLEEP_SECONDS: ${{ inputs.sleep_seconds }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate YDB migration secrets
        run: |
          missing=()
          for name in YDB_SERVICE_ACCOUNT_JSON YDB_ENDPOINT YDB_DATABASE; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            {
              echo 'Missing required GitHub Actions secrets for manual YDB migrations:'
              printf ' - %s\n' "${missing[@]}"
            } >&2
            exit 1
          fi
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .
      - name: Run migrate_ydb
        run: |
          max_attempts="${MAX_ATTEMPTS:-5}"
          sleep_seconds="${SLEEP_SECONDS:-120}"

          if ! [[ "${max_attempts}" =~ ^[1-9][0-9]*$ ]]; then
            echo 'max_attempts must be a positive integer' >&2
            exit 2
          fi
          if ! [[ "${sleep_seconds}" =~ ^[0-9]+$ ]]; then
            echo 'sleep_seconds must be a non-negative integer' >&2
            exit 2
          fi

          for attempt in $(seq 1 "${max_attempts}"); do
            echo "migrate_ydb attempt ${attempt}/${max_attempts}"
            if python src/manage.py migrate_ydb; then
              if [[ "${sleep_seconds}" != '0' ]]; then
                echo "sleeping ${sleep_seconds} seconds before the next service"
                sleep "${sleep_seconds}"
              fi
              exit 0
            fi

            if [[ "${attempt}" == "${max_attempts}" ]]; then
              break
            fi

            echo "migrate_ydb failed, sleeping ${sleep_seconds} seconds before retry"
            sleep "${sleep_seconds}"
          done

          exit 1
